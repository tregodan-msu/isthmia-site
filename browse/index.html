<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isthmia Archives — Excavation records in one place</title>
<meta name="description" content="The records of the excavations at Isthmia in one place: inventory cards, color slides and other collections, with the Isthmia photographs of the Gregory slide archive and the coins of the Clement catalog. Filter by type, area, trench, date and ruler.">
<link rel="preconnect" href="https://example.org">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="../css/app.css">
<style>:root { --accent: #3d5a80; --accent-ink: #2c4563; --accent-soft: #e1e8f0 }</style>
<script src="../config.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" id="brand" href="#"><span class="brand-mark">Ι</span><span><b>Isthmia Archives</b><small>Excavations at Isthmia · All archives</small></span></a>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Search every archive: areas, trenches, rulers, titles…" autocomplete="off" aria-label="Search the archive"></div>
  <nav class="views" id="views" aria-label="Views"></nav>
  <a class="story" id="story" href="https://msuisthmia.org" target="_blank" rel="noopener">MSU Excavations at Isthmia ↗</a>
</header>

<div class="typebar" id="typebar" hidden></div>
<div class="fbar" id="fbar">
  <div class="filters" id="filters"></div>
  <button class="link" id="clear" hidden>Clear filters</button>
  <div class="bar-right">
    <div class="count" id="count">Loading…</div>
    <label class="ctl" id="sortCtl"><select id="sort" aria-label="Sort"></select></label>
    <label class="ctl" id="sizeCtl" title="Card size"><input type="range" id="size" min="120" max="360" step="20" value="200" aria-label="Card size"></label>
    <div class="menu" id="colsCtl" hidden><button class="btn" id="colsBtn" title="Choose the columns of the table">Columns</button>
      <div class="menu-pop right pick-pop" id="colsMenu" hidden></div></div>
    <div class="menu"><button class="btn" id="exportBtn">Export</button>
      <div class="menu-pop right" id="exportMenu" hidden>
        <button data-x="csv">Download what’s shown (CSV)</button>
        <button data-x="json">Download what’s shown (JSON)</button>
        <button data-x="csvAll">Download all records (CSV)</button>
        <button data-x="jsonAll">Download all records (JSON)</button>
        <button data-x="link">Copy link to this view</button>
      </div></div>
  </div>
</div>
<div class="pop" id="pop" hidden></div>

<main class="view" id="view"><div class="loading-big"><div class="spinner"></div><p>Loading the archive…</p></div></main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
<script type="module" src="../js/app.js"></script>
</body>
</html>
